# .github/workflows/update-version.yml
name: Otomatik version.txt güncelle

on:
  release:
    types: [published]

jobs:
  update-version-file:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v3

      - name: Sürüm numarasýný al
        id: get_version
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: version.txt dosyasýný oluþtur
        run: |
          echo "$RELEASE_VERSION" > version.txt
          echo "https://github.com/${{ github.repository }}/releases/download/$RELEASE_VERSION/publish.zip" >> version.txt

      - name: Git ayarlarý
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit ve push
        run: |
          git add version.txt
          git commit -m "version.txt güncellendi -> $RELEASE_VERSION"
          git push
